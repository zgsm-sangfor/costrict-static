name: Release Static Files

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Prepare static files
      run: |
        echo "Running get-mirror.sh to get costrict-static.tar files..."
        chmod +x ./get-mirror.sh
        ./get-mirror.sh --force
        echo ""
        mkdir -p release-assets
        mv costrict-static.tar release-assets/
        ls -lh release-assets/costrict-static.tar

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          Costrict Static ${{ github.ref_name }}

          ## 内容
          - `costrict-static.tar`: 离线静态文件包（docker、docker-compose、jq、nginx 等）
        files: release-assets/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
